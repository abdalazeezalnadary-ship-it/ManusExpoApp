name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and tests
        run: |
          pnpm check
          pnpm test
          pnpm build:server
          pnpm build:web

      - name: Validate Expo project and bundle
        run: |
          node -e "const p=require('./app.json').expo; if (!p.extra?.eas?.projectId) { console.error('Link EAS once and commit extra.eas.projectId to app.json before running this workflow.'); process.exit(1); }"
          pnpm exec expo export --platform android

      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN as a GitHub repository secret; do not put it in source." >&2
            exit 1
          fi

      - name: Verify EAS preview API endpoint
        run: >-
          pnpm dlx eas-cli@latest env:exec preview --non-interactive
          "node -e 'const u=new URL(process.env.EXPO_PUBLIC_API_URL);if(u.protocol!==\"https:\"||u.username||u.password||u.search||u.hash){console.error(\"EXPO_PUBLIC_API_URL must be an HTTPS URL without credentials, query, or fragment.\");process.exit(2)}fetch(new URL(\"/api/health\",u)).then(r=>{console.log(\"preview_api_health=\"+r.status);process.exit(r.status===200?0:1)}).catch(()=>{console.error(\"Preview API health check failed.\");process.exit(1)})'"

      - name: Build internal APK
        run: pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive --wait
