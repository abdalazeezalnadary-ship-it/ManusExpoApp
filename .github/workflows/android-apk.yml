name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and tests
        run: |
          pnpm check
          pnpm test

      - name: Validate Expo project and bundle
        run: |
          node -e "const p=require('./app.json').expo; if (!p.extra?.eas?.projectId) { console.error('Link EAS once and commit extra.eas.projectId to app.json before running this workflow.'); process.exit(1); }"
          pnpm exec expo export --platform android

      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN as a GitHub repository secret; do not put it in source." >&2
            exit 1
          fi

      - name: Require public API URL
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "Add EXPO_PUBLIC_API_URL as a GitHub repository variable after deploying the API." >&2
            exit 1
          fi
          node - <<'JS'
          const value = process.env.EXPO_PUBLIC_API_URL;
          let url;
          try { url = new URL(value); } catch { throw new Error('EXPO_PUBLIC_API_URL must be a valid HTTPS URL.'); }
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
            throw new Error('EXPO_PUBLIC_API_URL must be HTTPS and must not contain credentials, query, or fragment.');
          }
          JS
          curl --fail --silent --show-error --max-time 15 "$EXPO_PUBLIC_API_URL/api/health" --output /dev/null

      - name: Sync public API URL to EAS preview environment
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: >-
          pnpm dlx eas-cli@latest env:set
          --environment preview
          --name EXPO_PUBLIC_API_URL
          --value "$EXPO_PUBLIC_API_URL"
          --type string
          --visibility plaintext
          --non-interactive

      - name: Build internal APK
        run: pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive --wait
